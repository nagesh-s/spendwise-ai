org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.daemon.performance.disable-logging=true

android.useAndroidX=true
android.enableJetifier=true
android.javaCompile.suppressSourceTargetDeprecationWarning=true
android.dependency.useConstraints=false

# Offline LLM (MediaPipe + Gemma 3 1B int4) flavor settings.
# Relative path is resolved against app internal files dir.
OFFLINE_LLM_MODEL_PATH=models/spendwise_gemma3_1b.task
OFFLINE_LLM_MODEL_ID=gemma-3-1b-it-int4
