plugins {
    id 'com.android.application'
}

def escapeForBuildConfig = { Object raw ->
    raw.toString()
            .replace("\\", "\\\\")
            .replace("\"", "\\\"")
}

def offlineLlmModelPath = escapeForBuildConfig(project.findProperty("OFFLINE_LLM_MODEL_PATH")
        ?: "models/spendwise_gemma3_1b.task")
def offlineLlmModelId = escapeForBuildConfig(project.findProperty("OFFLINE_LLM_MODEL_ID")
        ?: "gemma-3-1b-it-int4")

android {
    namespace 'com.spendwise.ai'
    compileSdk 34

    defaultConfig {
        applicationId "com.spendwise.ai"
        minSdk 24
        targetSdk 34
        versionCode 180
        versionName "1.8.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }

    buildTypes {
        debug {
            buildConfigField "boolean", "ALLOW_DESTRUCTIVE_DATABASE_MIGRATION", "true"
        }
        release {
            minifyEnabled true
            buildConfigField "boolean", "ALLOW_DESTRUCTIVE_DATABASE_MIGRATION", "false"
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    flavorDimensions "llmMode"
    productFlavors {
        standard {
            dimension "llmMode"
            buildConfigField "boolean", "OFFLINE_LLM_ENABLED", "false"
            buildConfigField "String", "OFFLINE_LLM_MODEL_PATH", "\"\""
            buildConfigField "String", "OFFLINE_LLM_MODEL_ID", "\"none\""
        }
        offlineLlm {
            dimension "llmMode"
            buildConfigField "boolean", "OFFLINE_LLM_ENABLED", "true"
            buildConfigField "String", "OFFLINE_LLM_MODEL_PATH", "\"${offlineLlmModelPath}\""
            buildConfigField "String", "OFFLINE_LLM_MODEL_ID", "\"${offlineLlmModelId}\""
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures {
        buildConfig true
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.navigation:navigation-fragment:2.7.7'
    implementation 'androidx.navigation:navigation-ui:2.7.7'
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.0'
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
    // MaterialCalendarView still pulls legacy support libs; exclude and rely on AndroidX.
    implementation('com.github.prolificinteractive:material-calendarview:2.0.1') {
        exclude group: 'com.android.support'
    }
    implementation 'com.jakewharton.threetenabp:threetenabp:1.4.4'
    implementation 'androidx.work:work-runtime:2.9.0'
    implementation 'androidx.biometric:biometric:1.1.0'
    offlineLlmImplementation 'com.google.mediapipe:tasks-genai:0.10.27'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    testImplementation 'org.mockito:mockito-core:5.10.0'
    testImplementation 'org.mockito:mockito-inline:5.2.0'
}

// Keep legacy command compatibility after introducing product flavors.
tasks.register("testDebugUnitTest") {
    group = "verification"
    description = "Runs unit tests for all debug flavors."
    dependsOn("testStandardDebugUnitTest", "testOfflineLlmDebugUnitTest")
}

tasks.register("assembleDebugAndroidTest") {
    group = "verification"
    description = "Assembles Android test APKs for all debug flavors."
    dependsOn("assembleStandardDebugAndroidTest", "assembleOfflineLlmDebugAndroidTest")
}

tasks.register("connectedDebugAndroidTest") {
    group = "verification"
    description = "Runs connected Android tests for all debug flavors."
    dependsOn("connectedStandardDebugAndroidTest", "connectedOfflineLlmDebugAndroidTest")
}
